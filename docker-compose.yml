services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: traj
      POSTGRES_PASSWORD: traj
      POSTGRES_DB: traj
    ports:
      - "5432:5432"
    volumes:
      - traj_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traj -d traj"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: &api-environment
      DATABASE_URL: postgresql+psycopg://traj:traj@postgres:5432/traj
      JOBS_MODE: worker
      DATA_DIR: /app/data
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:-local-compose-master-key-32b}
      JWT_SECRET: ${JWT_SECRET:-local-compose-jwt-secret-32-characters}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-choose-a-password-123}
      UPLOAD_DIR: /app/data/uploads
      INFERENCE_ENGINE_BASE_URL: ${INFERENCE_ENGINE_BASE_URL:-}
      INFERENCE_ENGINE_API_KEY: ${INFERENCE_ENGINE_API_KEY:-}
      INFERENCE_ENGINE_TENANT: ${INFERENCE_ENGINE_TENANT:-domain-trajectory-data-generation}
      INFERENCE_ENGINE_ORG_ID: ${INFERENCE_ENGINE_ORG_ID:-org-trajdata}
      INFERENCE_ENGINE_KEY_ID: ${INFERENCE_ENGINE_KEY_ID:-domain-trajectory-data-generation-primary}
      INFERENCE_ENGINE_JUDGE_MODEL: ${INFERENCE_ENGINE_JUDGE_MODEL:-qwen3.8:27b}
    ports:
      - "${API_HOST_PORT:-18000}:8000"
    volumes:
      - traj_uploads:/app/data/uploads
      - traj_runs:/app/data/runs
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment: *api-environment
    volumes:
      - traj_uploads:/app/data/uploads
      - traj_runs:/app/data/runs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  traj_pg:
  traj_uploads:
  traj_runs:
